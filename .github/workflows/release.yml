name: Release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m unittest discover -s tests -q
      - run: node tests/sensor-selection.cjs
      - run: node --check custom_components/rollladenplaner/frontend/shutter-manager-card.js
      - run: npm install --prefix .ci playwright
      - run: npx --prefix .ci playwright install --with-deps chromium
      - name: Browser regression checks
        env:
          NODE_PATH: ${{ github.workspace }}/.ci/node_modules
        run: |
          node tests/ui-test.cjs
          node tests/save-flow.cjs
          node tests/settings-flow.cjs
          node tests/shading-flow.cjs
      - name: Build verified archives
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: python scripts/build_release.py --tag "$RELEASE_TAG"
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$RELEASE_TAG" dist/*.zip --clobber
