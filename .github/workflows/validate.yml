name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m unittest discover -s tests -q
      - uses: actions/checkout@v4
        with:
          repository: v9h45n47mh-lab/wecker-manager
          ref: c312f59b3872e82cb815517104e23fb51c3c3bdd
          path: .ci/wecker-reference
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: v9h45n47mh-lab/music-manager
          ref: 5b312361676197bf1178ce76b63ab46ac76d3975
          path: .ci/music-reference
          persist-credentials: false
      - name: Verify real Wecker preview interoperability
        env:
          MUSIC_MANAGER_SOURCE: ${{ github.workspace }}/.ci/music-reference
        run: python3 tests/wecker-interop.py
      - run: node tests/ui-kit.cjs
      - run: node tests/sensor-selection.cjs
      - run: node --check custom_components/rollladenplaner/frontend/shutter-manager-card.js
      - run: python scripts/build_release.py --check-only
      - run: npm install --prefix .ci playwright
      - run: npx --prefix .ci playwright install --with-deps chromium
      - uses: actions/checkout@v4
        with:
          repository: v9h45n47mh-lab/ha-ui-kit
          ref: 393474e75869ba79195d800624a5a793a51fe2c4
          path: .ci/ha-ui-kit
      - name: Verify shared UI build, tests and vendoring
        run: |
          npm --prefix .ci/ha-ui-kit run build
          npm --prefix .ci/ha-ui-kit test
          npm --prefix .ci/ha-ui-kit run check
          node .ci/ha-ui-kit/scripts/vendor.mjs --target custom_components/rollladenplaner/frontend --check
      - name: Browser and save-flow tests
        env:
          NODE_PATH: ${{ github.workspace }}/.ci/node_modules
        run: |
          python - <<'PYCODE'
          import subprocess
          scripts = ['.ci/ha-ui-kit/tests/browser.cjs', '.ci/ha-ui-kit/tests/account-tiles.cjs', '.ci/ha-ui-kit/tests/music-player.cjs', '.ci/ha-ui-kit/tests/gallery.cjs', '.ci/ha-ui-kit/tests/program-rows.cjs', 'tests/ui-kit-flow.cjs', 'tests/wecker-flow.cjs', 'tests/program-layout.cjs', 'tests/ui-test.cjs', 'tests/save-flow.cjs', 'tests/settings-flow.cjs', 'tests/shading-flow.cjs', 'tests/release-131.cjs']
          failed = []
          for script in scripts:
              if subprocess.run(['node', script]).returncode:
                  failed.append(script)
          if failed:
              raise SystemExit('Browser checks failed: '+', '.join(failed))
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-kit-desktop-mobile
          path: .ci/ui-kit-results/
          if-no-files-found: ignore
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  publish:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-release]') }}
    needs: [tests, hacs, hassfest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read release metadata and notes
        id: metadata
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          version = json.loads(Path('custom_components/rollladenplaner/manifest.json').read_text())['version']
          changelog = Path('CHANGELOG.md').read_text()
          match = re.search(r'^## '+re.escape(version)+r'\n(.*?)(?=^## |\Z)', changelog, re.M | re.S)
          if not match:
              raise SystemExit('Release changelog is missing')
          Path('release-notes.md').write_text(match[1].strip()+'\n\nValidation: Python/browser tests, HACS and Hassfest passed for this commit.\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag=v{version}\nversion={version}\n')
          PY
      - name: Build verified release archives
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: python scripts/build_release.py --tag "$RELEASE_TAG"
      - name: Publish checked commit and archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          gh release create "$RELEASE_TAG" \
            --target "$RELEASE_COMMIT" \
            --title "Shutter Manager $RELEASE_VERSION" \
            --notes-file release-notes.md \
            dist/*.zip
